name: Android Release Build

on:
  push:
    branches: [ main ]
    paths:
      - 'android/**'
      - 'client/**'
      - 'shared/**'
      - 'package.json'
      - 'package-lock.json'
      - 'vite.config.ts'
      - '.github/workflows/android-build.yml'
  workflow_dispatch:

jobs:
  build:
    name: Build & sign release APK/AAB
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      # ── Checkout ───────────────────────────────────────────────────────────
      - uses: actions/checkout@v4

      # ── Java 17 (required for AGP 8+) ──────────────────────────────────────
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      # ── Gradle wrapper permissions ──────────────────────────────────────────
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install web dependencies
        run: npm ci

      # Gradle bundles dist/public; without this step the APK ships with no web app
      # (syncWebAssets reports NO-SOURCE). VITE_* values are public client config; the anon
      # key is a public key, never the service-role key. Missing values only warn.
      - name: Build web client
        env:
          VITE_BILLING_API_URL: ${{ secrets.VITE_BILLING_API_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$VITE_BILLING_API_URL" ] || [ -z "$VITE_SUPABASE_ANON_KEY" ]; then
            echo "::warning::VITE_BILLING_API_URL / VITE_SUPABASE_ANON_KEY not set; Android purchase verification will be unavailable in this build."
          fi
          npx vite build
          test -f dist/public/index.html

      - name: Grant execute permission for gradlew
        run: chmod +x android/gradlew

      # ── Ensure gradle-wrapper.jar is present (fails fast with clear message) ─
      - name: Verify gradle-wrapper.jar
        run: |
          JAR=android/gradle/wrapper/gradle-wrapper.jar
          if [ ! -f "$JAR" ]; then
            echo "❌ gradle-wrapper.jar is missing. Commit android/gradle/wrapper/gradle-wrapper.jar to the repo."
            exit 1
          fi
          echo "✅ gradle-wrapper.jar present ($(du -h $JAR | cut -f1))"

      # ── (Optional) Write keystore from secret ───────────────────────────────
      # Decode KEYSTORE_BASE64 secret → keystore.jks
      # Uses shell conditional so secrets context is not evaluated in if/ternary.
      - name: Decode release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > android/app/keystore.jks
            echo "PFTC_SIGNING_STORE_FILE=$GITHUB_WORKSPACE/android/app/keystore.jks" >> $GITHUB_ENV
          else
            echo "No keystore secret found — building unsigned (debug signing)"
          fi

      # TEMPORARY: verify decoded keystore. Remove after signing is confirmed.
      - name: Verify decoded keystore (temporary)
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          set -euo pipefail
          sha256sum android/app/keystore.jks
          if ! keytool -list -v -alias "$KEY_ALIAS" -keystore android/app/keystore.jks -storepass:env KEYSTORE_PASSWORD > "$RUNNER_TEMP/keystore-info.txt" 2>&1; then
            echo "keytool failed:"
            grep -iE "exception|password|alias|not exist|invalid" "$RUNNER_TEMP/keystore-info.txt" | head -3 || true
            rm -f "$RUNNER_TEMP/keystore-info.txt"
            exit 1
          fi
          grep -m1 "SHA1:" "$RUNNER_TEMP/keystore-info.txt"
          rm -f "$RUNNER_TEMP/keystore-info.txt"

      # ── Build ──────────────────────────────────────────────────────────────
      - name: Build release APK
        working-directory: android
        # app/build.gradle.kts reads PFTC_SIGNING_*; both Gradle steps need them.
        env:
          PFTC_SIGNING_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          PFTC_SIGNING_KEY_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          PFTC_SIGNING_STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon

      - name: Build release AAB (Play Store)
        working-directory: android
        env:
          PFTC_SIGNING_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          PFTC_SIGNING_KEY_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          PFTC_SIGNING_STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: ./gradlew bundleRelease --no-daemon

      # ── Upload artifacts ───────────────────────────────────────────────────
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          retention-days: 30

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
          retention-days: 30

      # ── Verify package structure (catch regressions) ───────────────────────
      - name: Verify single Java package
        run: |
          count=$(find android/app/src/main/java/com -mindepth 1 -maxdepth 1 -type d | wc -l)
          if [ "$count" -ne 1 ]; then
            echo "❌ Expected 1 Java package directory, found $count"
            find android/app/src/main/java/com -mindepth 1 -maxdepth 1 -type d
            exit 1
          fi
          echo "✅ Single Java package confirmed"

